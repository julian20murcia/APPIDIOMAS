name: appidiomas
publish_to: 'none'
description: LingoVerse - MVP visual para aprendizaje de idiomas.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/art/worlds/
    - assets/art/ui/
    - assets/art/decor/
    - assets/art/bubbles/
    - assets/art/landmarks/