name: appidiomas
publish_to: 'none'

description: LingoVerse - Plataforma interactiva para aprendizaje de idiomas.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Persistencia local
  shared_preferences: ^2.5.5

  # Voz y pronunciación
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.5
  firebase_app_check: ^0.4.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Identidad visual de LingoVerse
    - assets/art/brand/
    - assets/art/mascot/

    # Mundos e idiomas
    - assets/art/worlds/
    - assets/art/landmarks/
    - assets/art/bubbles/

    # Interfaz
    - assets/art/ui/
    - assets/art/decor/
