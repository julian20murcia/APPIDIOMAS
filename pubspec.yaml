name: appidiomas
publish_to: 'none'
description: LingoVerse - MVP visual para aprendizaje de idiomas.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.5
  firebase_app_check: ^0.4.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/art/worlds/
    - assets/art/ui/
    - assets/art/decor/
    - assets/art/bubbles/
    - assets/art/landmarks/